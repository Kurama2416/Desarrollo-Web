<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manglü | Granizados Artesanales</title>
    
    <link rel="stylesheet" href="styles.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <a href="#inicio" class="logo-link">
                <div class="logo-badge">MANGLÜ</div>
            </a>
        </div>
        
        <nav class="nav-menu" id="navMenu">
            <ul id="navList"></ul>
        </nav>

        <a href="#contacto" class="btn btn-primary btn-header-desktop">Pedir ahora</a>

        <button class="nav-toggle" id="navToggle" aria-label="Abrir Menú">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <section id="inicio" class="hero">
        <div class="hero-container" id="heroContainer"></div>
    </section>

    <section id="menu" class="menu-section">
        <div class="section-header" id="menuHeader"></div>
        <div class="products-grid" id="productsGrid"></div>
    </section>

    <section id="nosotros" class="about-section">
        <div class="about-container" id="aboutContainer"></div>
    </section>

    <section id="galeria" class="gallery-section">
        <div class="section-header" id="galleryHeader"></div>
        <div class="gallery-grid" id="galleryGrid"></div>
        <div class="gallery-footer" id="galleryFooter"></div>
    </section>

    <section id="contacto" class="cta-whatsapp">
        <div class="cta-container" id="ctaContainer"></div>
    </section>

    <footer class="footer" id="footerContainer"></footer>

    <script src="data.js"></script>
    <script src="main.js"></script>
</body>
</html>
